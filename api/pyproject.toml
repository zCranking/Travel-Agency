[project]
name = "wayfare-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "supabase>=2.9",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "voyageai>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Windows ships no system tz database, so zoneinfo needs this to resolve
    # IANA keys. The planner compares meeting and flight instants across
    # zones, so it is not optional here.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "travel*", "policy*", "agent*", "evals*", "planning*", "routes*"]
